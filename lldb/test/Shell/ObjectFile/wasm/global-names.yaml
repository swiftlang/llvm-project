# REQUIRES: webassembly

# RUN: yaml2obj %s -o %t.wasm
# RUN: %lldb %t.wasm -o 'image lookup -r -s "^my_global$"' \
# RUN:   -o 'image lookup -r -s "^other_global$"' -o 'image lookup -r -s "^func$"' \
# RUN:   2>&1 | FileCheck %s

# Loading the module must keep the address-type tag and add the module id, so
# that a global still resolves to a Global-typed address afterwards.
# RUN: %lldb %t.wasm -o 'target modules load --file global-names.yaml.tmp.wasm --slide 0x400000000' \
# RUN:   -o 'image lookup -r -s "^other_global$" -v' \
# RUN:   2>&1 | FileCheck %s --check-prefix=LOADED

# Globals from the name section's GlobalNames subsection become symbols. A Wasm
# global is not in linear memory, so it lives in a synthetic "global" section
# whose address encodes WasmAddressType::Global (2) in the top two bits; the
# symbol's offset within that section is the global index.

# CHECK-LABEL: image lookup -r -s "^my_global$"
# CHECK: 1 symbols match
# CHECK: Address: {{.*}}[0x8000000000000000] ({{.*}}.global + 0)
# CHECK: Summary: {{.*}}my_global

# CHECK-LABEL: image lookup -r -s "^other_global$"
# CHECK: 1 symbols match
# CHECK: Address: {{.*}}[0x8000000000000001] ({{.*}}.global + 1)
# CHECK: Summary: {{.*}}other_global

# Function symbols still resolve to a real code address, not a register.
# CHECK-LABEL: image lookup -r -s "^func$"
# CHECK: 1 symbols match
# CHECK: Address: {{.*}}.code
# CHECK: Summary: {{.*}}`func

# Tag (0x8...) preserved, module id 4 added, global index 1 in the low bits.
# LOADED: range = [0x8000000400000001-{{.*}}other_global

--- !WASM
FileHeader:
  Version:         0x00000001
Sections:
  - Type:            TYPE
    Signatures:
      - Index:           0
        ParamTypes:      []
        ReturnTypes:     []
  - Type:            FUNCTION
    FunctionTypes:   [ 0 ]
  - Type:            GLOBAL
    Globals:
      - Index:           0
        Type:            I32
        Mutable:         true
        InitExpr:
          Opcode:          I32_CONST
          Value:           0
      - Index:           1
        Type:            I32
        Mutable:         true
        InitExpr:
          Opcode:          I32_CONST
          Value:           0
  - Type:            CODE
    Functions:
      - Index:           0
        Locals:          []
        Body:            0B
  - Type:            CUSTOM
    Name:            name
    FunctionNames:
      - Index:           0
        Name:            func
    GlobalNames:
      - Index:           0
        Name:            my_global
      - Index:           1
        Name:            other_global
